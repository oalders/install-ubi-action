---
name: 'Install ubi (Universal Binary Installer)'
description: 'Installs ubi, a tool for installing pre-built binaries'
author: 'Your Name'

branding:
  icon: 'download'
  color: 'blue'

inputs:
  projects:
    description: 'Newline-delimited list of projects to install using ubi after installation'
    required: false
    default: ''
  sudo:
    description: 'Whether to use sudo for installation (required for /usr/local/bin on most systems)'
    required: false
    default: 'false'
  GITHUB_TOKEN:
    description: 'GitHub token to use for API requests, helps avoid rate limiting'
    required: false
    default: ''
  version:
    description: 'ubi release tag to install, with leading v (e.g. v0.13.0)'
    required: false
    # Bump together with COMMIT below, and only to immutable releases.
    default: 'v0.13.0'

outputs:
  version:
    description: 'The version of ubi that was installed'
    value: ${{ steps.install.outputs.version }}

  path:
    description: 'The path where ubi was installed'
    value: ${{ steps.install.outputs.path }}

runs:
  using: 'composite'
  steps:
    - name: Install ubi
      id: install
      shell: sh
      env:
        INPUT_PROJECTS: ${{ inputs.projects }}
        INPUT_SUDO: ${{ inputs.sudo }}
        INPUT_GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        # -f: $project is word-split on purpose (to carry ubi flags), never globbed.
        set -eufx

        # An empty tag falls back to latest and a slash can redirect the download path.
        case "$INPUT_VERSION" in
          ''|*/*)
            echo "Invalid version: $INPUT_VERSION" >&2
            exit 1
            ;;
        esac

        echo "Installing ubi universal binary installer..."

        # If run as non-root, ubi defaults to installing into ~/bin, which is
        # not in the default PATH in GitHub CI. So, we'll default to
        # ~/.local/bin
        LOCAL_BIN=$HOME/.local/bin
        test -d $LOCAL_BIN || mkdir -p $LOCAL_BIN
        if [ "$INPUT_SUDO" != "true" ] && [ -z "${TARGET:-}" ]; then
          TARGET=$LOCAL_BIN
          echo "Setting TARGET to ${TARGET}"
          export TARGET
        fi

        COMMIT=d9348539c2521f05225618139ea23fd3f54bce46
        URL_PATH="houseabsolute/ubi/$COMMIT/bootstrap/bootstrap-ubi.sh"
        INSTALLER=https://raw.githubusercontent.com/$URL_PATH

        # Download and run the bootstrap script
        INSTALLER_FILE=$(mktemp)
        trap 'rm -f "$INSTALLER_FILE"' EXIT
        curl --fail --show-error --silent --location --output "$INSTALLER_FILE" "$INSTALLER"
        if [ "$INPUT_SUDO" = "true" ]; then
          if [ -z "${TARGET:-}" ]; then
            sudo env TAG="$INPUT_VERSION" sh "$INSTALLER_FILE"
          else
            sudo env TAG="$INPUT_VERSION" TARGET="$TARGET" sh "$INSTALLER_FILE"
          fi
        else
          env TAG="$INPUT_VERSION" TARGET="$TARGET" sh "$INSTALLER_FILE"
        fi
        if [ ! -z "${TARGET:-}" ]; then
          if [ ! "$(command -v ubi)" ]; then
            # Maybe add to PATH for subsequent steps
            echo "$TARGET" >> $GITHUB_PATH

            # update path for any projects which may need to be installed
            PATH="$TARGET:$PATH"
          fi
        fi

        # Verify installation
        # Check the binary we installed, not whatever ubi is earlier on PATH.
        # With no TARGET (sudo only), the bootstrap installs as root to /usr/local/bin; recheck on COMMIT bumps.
        UBI_PATH="${TARGET:-/usr/local/bin}/ubi"
        if [ -x "$UBI_PATH" ]; then
          UBI_VERSION=$("$UBI_PATH" --version | head -n1 | awk '{print $2}')
          if [ -z "$UBI_VERSION" ]; then
            echo "❌ $UBI_PATH did not report a version"
            exit 1
          fi
          echo "✅ ubi ${UBI_VERSION} installed successfully at ${UBI_PATH}"
          echo "version=${UBI_VERSION}" >> $GITHUB_OUTPUT
          echo "path=${UBI_PATH}" >> $GITHUB_OUTPUT
        else
          echo "❌ Failed to install ubi"
          exit 1
        fi

        # Install additional projects if specified
        if [ -n "$INPUT_PROJECTS" ]; then
          echo "Installing specified projects with ubi..."

          # Export with xtrace off so the token stays out of the log and out of argv.
          set +x
          export GITHUB_TOKEN="$INPUT_GITHUB_TOKEN"
          set -x

          # Process each project in the newline-delimited list
          printf '%s\n' "$INPUT_PROJECTS" | while read -r project; do
            if [ -n "$project" ]; then
              echo "Installing $project..."

              if [ "$INPUT_SUDO" = "true" ]; then
                sudo --preserve-env=GITHUB_TOKEN ubi --project $project
              else
                project_has_in=$(echo "$project" | grep -- "--in" || true)
                if [ -z "$project_has_in" ] && [ -n "$TARGET" ]; then
                  ubi --project $project --in "$TARGET"
                else
                  ubi --project $project
                fi
              fi

              echo "✅ Installed $project"
            fi
          done
        fi

---
name: lint
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precious:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned so a new upstream release can't turn lint red on its own.
      - name: Install precious, shellcheck and zizmor
        uses: ./
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          projects: |
            houseabsolute/precious --tag v1.0.0
            koalaman/shellcheck --tag v0.11.0
            zizmorcore/zizmor --tag v1.32.0

      - name: precious lint
        run: precious lint -q --all
        env:
          # zizmor's online audits (impostor commits, known-vulnerable actions) need it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

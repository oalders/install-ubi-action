---
name: lint
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precious:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # default, not measured; see tune-gh-actions-timeouts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --git-diff-from needs the merge base with the PR's base branch.
          fetch-depth: 0

      - name: Install precious and shellcheck
        uses: ./
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          projects: |
            houseabsolute/precious
            koalaman/shellcheck

      - name: precious lint
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            precious lint -q --git-diff-from "origin/$BASE_REF"
          else
            precious lint -q --all
          fi

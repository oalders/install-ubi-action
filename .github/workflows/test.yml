---
name: CI
on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  minimal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ubi
        uses: ./
        id: ubi
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          sudo: 'false$(touch pwned)'
          projects: |
            oalders/is
            oalders/debounce -v

      - name: Verify installations
        run: |
          test ! -e "$GITHUB_WORKSPACE/pwned"
          [ "${{ steps.ubi.outputs.version }}" = "0.13.0" ]
          is there ubi --verbose
          is there is --verbose
          is there debounce --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  no_sudo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ubi
        uses: ./
        id: ubi
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: v0.12.0

      - name: Use ubi to install other tools
        run: ubi --project oalders/is --in /home/runner/.local/bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installations
        run: |
          [ "${{ steps.ubi.outputs.version }}" = "0.12.0" ]
          is there ubi --verbose
          is there is --verbose
          is known summary var --md >> $GITHUB_STEP_SUMMARY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sudo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ubi
        uses: ./
        id: ubi
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          sudo: true
      - name: Use ubi to install other tools
        run: |
          sudo ubi --project oalders/is --in /usr/local/bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installations
        run: |
          echo "ubi version: ${{ steps.ubi.outputs.version }}"
          echo "ubi path: ${{ steps.ubi.outputs.path }}"
          [ "${{ steps.ubi.outputs.version }}" = "0.13.0" ]
          is there ubi --verbose
          is there is --verbose
          sudo is known summary var --md >> $GITHUB_STEP_SUMMARY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sudo_with_target:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ubi
        uses: ./
        id: ubi
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          sudo: true
        env:
          TARGET: /usr/local/sbin
      - name: Use ubi to install other tools
        run: |
          sudo ubi --project oalders/is --in /usr/sbin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installations
        run: |
          echo "ubi version: ${{ steps.ubi.outputs.version }}"
          echo "ubi path: ${{ steps.ubi.outputs.path }}"
          is there ubi --verbose
          is there is --verbose
  projects_injection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ubi
        uses: ./
        id: ubi
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          projects: '$(touch pwned-projects)'

      # ubi on PATH proves the run reached the projects loop.
      - name: Verify projects input was not executed
        run: |
          [ "${{ steps.ubi.outcome }}" = failure ]
          command -v ubi
          test ! -e "$GITHUB_WORKSPACE/pwned-projects"
  invalid_version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ubi with empty version
        uses: ./
        id: empty
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: ''

      - name: Install ubi with slash in version
        uses: ./
        id: slash
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: 'v0.13.0/x'

      # No ubi on PATH proves rejection happened before anything installed.
      - name: Verify invalid versions were rejected
        run: |
          [ "${{ steps.empty.outcome }}" = failure ]
          [ "${{ steps.slash.outcome }}" = failure ]
          if command -v ubi; then exit 1; fi
  alpine:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: apk add curl

      - name: Install ubi
        uses: ./
        id: ubi
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          projects: |
            oalders/is -v
            oalders/debounce -v

      - name: Verify installations
        run: |
          is there ubi --verbose
          is there is --verbose
          is there debounce --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

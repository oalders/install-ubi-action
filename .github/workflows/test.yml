---
name: CI
on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ubi
        uses: ./
        id: ubi
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          sudo: 'false$(touch pwned)'
          projects: |
            oalders/is --tag v0.14.3
            oalders/debounce --tag v0.5.2 -v

      - name: Verify installations
        run: |
          test ! -e "$GITHUB_WORKSPACE/pwned"
          [ "${{ steps.ubi.outputs.version }}" = "0.13.0" ]
          is there ubi --verbose
          is there is --verbose
          is there debounce --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  no_sudo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ubi
        uses: ./
        id: ubi
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: v0.12.0

      - name: Use ubi to install other tools
        run: ubi --project oalders/is --tag v0.14.3 --in /home/runner/.local/bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installations
        run: |
          [ "${{ steps.ubi.outputs.version }}" = "0.12.0" ]
          is there ubi --verbose
          is there is --verbose
          is known summary var --md >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sudo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ubi
        uses: ./
        id: ubi
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          sudo: true
      - name: Use ubi to install other tools
        run: |
          sudo --preserve-env=GITHUB_TOKEN ubi --project oalders/is --tag v0.14.3 --in /usr/local/bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installations
        run: |
          echo "ubi version: ${{ steps.ubi.outputs.version }}"
          echo "ubi path: ${{ steps.ubi.outputs.path }}"
          [ "${{ steps.ubi.outputs.version }}" = "0.13.0" ]
          is there ubi --verbose
          is there is --verbose
          sudo is known summary var --md >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sudo_with_target:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ubi
        uses: ./
        id: ubi
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          sudo: true
        env:
          TARGET: /usr/local/sbin
      - name: Use ubi to install other tools
        run: |
          sudo --preserve-env=GITHUB_TOKEN ubi --project oalders/is --tag v0.14.3 --in /usr/local/sbin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installations
        run: |
          echo "ubi version: ${{ steps.ubi.outputs.version }}"
          echo "ubi path: ${{ steps.ubi.outputs.path }}"
          is there ubi --verbose
          is there is --verbose
  projects_injection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ubi
        uses: ./
        id: ubi
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          projects: '$(touch pwned-projects)'

      # ubi on PATH proves the run reached the projects loop.
      - name: Verify projects input was not executed
        run: |
          [ "${{ steps.ubi.outcome }}" = failure ]
          command -v ubi
          test ! -e "$GITHUB_WORKSPACE/pwned-projects"
  stray_filename:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FILENAME: not-a-real-asset.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ubi
        uses: ./
        id: ubi
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installation
        run: |
          [ "${{ steps.ubi.outputs.version }}" = "0.13.0" ]

  shadowed_ubi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Put a broken ubi first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/shadow"
          printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/shadow/ubi"
          chmod +x "$RUNNER_TEMP/shadow/ubi"
          echo "$RUNNER_TEMP/shadow" >> "$GITHUB_PATH"

      - name: Install ubi
        uses: ./
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          projects: oalders/is --tag v0.14.3

      - name: Verify the installed ubi wins on PATH
        run: |
          [ "$(command -v ubi)" = "$HOME/.local/bin/ubi" ]
          is there is --verbose
  sudo_projects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ubi
        uses: ./
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          sudo: true
          projects: |
            oalders/is --tag v0.14.3
            oalders/debounce --tag v0.5.2 -i /usr/local/sbin

      - name: Verify installations
        run: |
          [ "$(command -v is)" = /usr/local/bin/is ]
          # Checked directly: /usr/local/sbin on PATH is a runner-image detail.
          [ -x /usr/local/sbin/debounce ]
          is there ubi --verbose
  token_not_logged:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner masks the token in its own log, so capture the raw output to check it.
      - name: Run the install script with output captured
        run: |
          # An empty token would match every line below.
          [ -n "$INPUT_GITHUB_TOKEN" ]
          for sudo in false true; do
            if ! INPUT_SUDO=$sudo sh ./install-ubi.sh > "$RUNNER_TEMP/out.log" 2>&1; then
              cat "$RUNNER_TEMP/out.log"
              exit 1
            fi
            # Pattern on stdin keeps the token out of grep's argv.
            if printf '%s\n' "$INPUT_GITHUB_TOKEN" | grep -qFf - "$RUNNER_TEMP/out.log"; then
              echo "token leaked with sudo=$sudo"
              exit 1
            fi
          done
        env:
          INPUT_PROJECTS: oalders/is --tag v0.14.3
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: v0.13.0
  home_with_space:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Unquoted, these paths are word-split and the default TARGET is never created.
      - name: Run the install script with a space in HOME
        run: |
          export HOME="$RUNNER_TEMP/home dir"
          mkdir -p "$HOME"
          export GITHUB_OUTPUT="$HOME/output" GITHUB_PATH="$HOME/path"
          sh ./install-ubi.sh
          grep -qxF "path=$HOME/.local/bin/ubi" "$GITHUB_OUTPUT"
          grep -qxF "$HOME/.local/bin" "$GITHUB_PATH"
        env:
          INPUT_PROJECTS: ''
          INPUT_SUDO: 'false'
          INPUT_GITHUB_TOKEN: ''
          INPUT_VERSION: v0.13.0
  projects_glob:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A glob would expand to this path and install oalders/is.
      - run: mkdir -p oalders/is

      - name: Install ubi
        uses: ./
        id: ubi
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          projects: oalders/i[s]

      # ubi on PATH proves the run reached the projects loop.
      - name: Verify the project line was not glob-expanded
        run: |
          [ "${{ steps.ubi.outcome }}" = failure ]
          command -v ubi
          if command -v is; then exit 1; fi
  invalid_version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ubi with empty version
        uses: ./
        id: empty
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: ''

      - name: Install ubi with slash in version
        uses: ./
        id: slash
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: 'v0.13.0/x'

      # No ubi on PATH proves rejection happened before anything installed.
      - name: Verify invalid versions were rejected
        run: |
          [ "${{ steps.empty.outcome }}" = failure ]
          [ "${{ steps.slash.outcome }}" = failure ]
          if command -v ubi; then exit 1; fi
  alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: alpine:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: apk add curl

      - name: Install ubi
        uses: ./
        id: ubi
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          projects: |
            oalders/is --tag v0.14.3 -v
            oalders/debounce --tag v0.5.2 -v

      - name: Verify installations
        run: |
          is there ubi --verbose
          is there is --verbose
          is there debounce --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  target_newline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ubi with a newline in TARGET
        uses: ./
        id: lf
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        env:
          TARGET: "/tmp/ubi-lf\n/tmp/injected-lf"

      - name: Install ubi with a carriage return in TARGET
        uses: ./
        id: cr
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        env:
          TARGET: "/tmp/ubi-cr\r/tmp/injected-cr"

      # A line-based GITHUB_PATH write would have added the second path.
      - name: Verify both were rejected before touching PATH
        run: |
          [ "$LF_OUTCOME" = failure ]
          [ "$CR_OUTCOME" = failure ]
          case ":$PATH:" in *injected*) exit 1 ;; esac
        env:
          LF_OUTCOME: ${{ steps.lf.outcome }}
          CR_OUTCOME: ${{ steps.cr.outcome }}
  sudo_no_local_bin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A fresh HOME, because the runner's own ~/.local/bin may already exist.
      - name: Run the install script with sudo and no TARGET
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          export GITHUB_OUTPUT="$HOME/output" GITHUB_PATH="$HOME/path"
          sh ./install-ubi.sh
          test ! -e "$HOME/.local/bin"
        env:
          INPUT_PROJECTS: ''
          INPUT_SUDO: 'true'
          INPUT_GITHUB_TOKEN: ''
          INPUT_VERSION: v0.13.0
